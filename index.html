<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      The chrome around the sky is the sky's colour, so a phone's status bar and
      the notch area disappear into it rather than framing it.
    -->
    <meta name="theme-color" content="#04060d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Installable: the shared link is the whole distribution story, so it
         should be able to become an icon on a phone. `start_url` and
         `scope` are relative so the same manifest works at a domain root
         and under a GitHub project path. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Stellune — the real sky, as calm ambient sound</title>
    <meta
      name="description"
      content="Stellune turns the real stars above a place and date into calm ambient music. A star sounds when it truly rises, culminates or sets. Runs entirely in your browser; nothing you enter is sent anywhere."
    />
  </head>
  <body>
    <div id="app" data-screen="loading"></div>
    <noscript>
      <p style="color: #93a0bb; font-family: system-ui, sans-serif; padding: 2rem">
        Stellune computes a real sky in your browser, so it needs JavaScript
        switched on. Nothing you enter is ever sent anywhere.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
