<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Cosmophony</title>
  <!--
    The dome, seen the way the app draws it: the horizon ring, and one star
    sounding inside it. Deliberately not a logo — it is the product's own
    picture at 64 pixels.
  -->
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#16203c"/>
      <stop offset="65%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <radialGradient id="lead" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="22%" stop-color="#dfe9ff" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#9fc0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7ea6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#space)"/>

  <!-- the horizon ring, and the 30-degree ring inside it -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#96aad2" stroke-opacity="0.30" stroke-width="1"/>
  <circle cx="32" cy="32" r="12.9" fill="none" stroke="#96aad2" stroke-opacity="0.13" stroke-width="1"/>

  <!-- quiet field: real magnitudes would be invisible here, so these are few and small -->
  <circle cx="21" cy="22" r="0.9" fill="#cfe0ff" fill-opacity="0.75"/>
  <circle cx="44" cy="24" r="0.7" fill="#ffd9bd" fill-opacity="0.7"/>
  <circle cx="26" cy="44" r="0.8" fill="#e6eeff" fill-opacity="0.65"/>
  <circle cx="45" cy="41" r="0.6" fill="#bcd4ff" fill-opacity="0.6"/>
  <circle cx="33" cy="17" r="0.6" fill="#e9f0ff" fill-opacity="0.55"/>
  <circle cx="17" cy="35" r="0.6" fill="#ffe4cd" fill-opacity="0.5"/>

  <!-- the lead: one star, sounding -->
  <circle cx="37" cy="30" r="11" fill="url(#lead)"/>
  <circle cx="37" cy="30" r="1.7" fill="#ffffff"/>
</svg>
